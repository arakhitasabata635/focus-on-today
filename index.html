<!DOCTYPE htmlprogresh-bar>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="javascript.js" defer></script>
    <title>Focus on to day</title>
  </head>
  <body>
    <main>
      <h1 class="focus-today">Focus on <span class="today">Today</span></h1>
      <div class="today-container">
        <div class="today-sun">
          <p class="container-1stpara">Today</p>
          <div class="img">
            <img class="sun-image" src="/image/🦆 icon _Sun_.svg" />
            <img class="face-of-img" src="/image/Group 3.svg" />
          </div>
        </div>
        <p class="container-2ndstpara">
          
        </p>
        <div class="progresh-bar">
          <div class="progresh-value">
            <p></p>
          </div>
          <p class="error">Please set all the 3 goals!</p>
        </div>
        <!-- ------------------task-------------------------- -->
        <div class="task">
          <div class="gole">
            <img class="right" src="/image/Vector 1.svg" />
          </div>
          <input
            id="first"
            class="taskInput"
            type="text"
            placeholder="Add new goal... "
          />
        </div>
        <div class="task">
          <div class="gole">
            <img class="right" src="/image/Vector 1.svg" />
          </div>
          <input
            id="second"
            class="taskInput"
            type="text"
            placeholder="Add new goal... "
          />
        </div>
        <div class="task">
          <div class="gole">
            <img class="right" src="/image/Vector 1.svg" />
          </div>
          <input
            id="third"
            class="taskInput"
            type="text"
            placeholder="Add new goal... "
          />
        </div>
        <p class="keep-going">“Keep Going, You’re making great progress!”</p>
        <p class="made-width">Made with ❤️ by arakhita</p>
      </div>
    </main>
  </body>
</html>
